name: Build and publish NoSQL Valkey API image to GitHub Container Registry

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE_NAME: nosql-valkey-api

jobs:
  push:
    name: Build and push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: maven

      - name: Read Maven project version
        id: version
        working-directory: java
        run: |
          VERSION="$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release tag matches Maven version
        if: github.event_name == 'release'
        env:
          MAVEN_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [ "$RELEASE_VERSION" != "$MAVEN_VERSION" ]; then
            echo "Release tag ($RELEASE_TAG) does not match pom.xml"
            echo "version ($MAVEN_VERSION)."
            exit 1
          fi

      - name: Build API Adapter
        run: mvn -f ./java/pom.xml clean package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert repository owner to lowercase
        id: repo-owner
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          echo "repo-owner=${REPO_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: >-
            ghcr.io/${{ steps.repo-owner.outputs.repo-owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
